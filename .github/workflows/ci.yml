name: checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Scrub check (generic rules)
        run: tools/dev/scrub-check

      - name: Licenses (REUSE)
        uses: fsfe/reuse-action@v5

      - name: Shell scripts
        run: |
          grep -rlE '^#!.*\b(ba|da)?sh\b' tools systemd config .githooks \
            | xargs --no-run-if-empty shellcheck

      - name: Python scripts
        run: |
          grep -rlE '^#!.*python' tools systemd config \
            | xargs --no-run-if-empty -n1 python3 -m py_compile

      - name: Kernel patch style
        run: |
          # checkpatch from v7.3 knows the Assisted-by tag. Both hosts throttle
          # now and then, so retry, and fall back from kernel.org to GitHub.
          mkdir -p "$RUNNER_TEMP/cp"
          get() {
            curl -fsSL --retry 5 --retry-all-errors --retry-delay 5 -o "$RUNNER_TEMP/cp/$1" "$2"
          }
          for f in checkpatch.pl spelling.txt const_structs.checkpatch; do
            get "$f" "https://git.kernel.org/pub/scm/linux/kernel/git/torvalds/linux.git/plain/scripts/$f?h=v7.3" ||
              get "$f" "https://raw.githubusercontent.com/torvalds/linux/v7.3/scripts/$f"
          done
          # Signed-off-by is added by the human submitter, not stored here
          # (see patches/kernel-7.3/README.md). checkpatch checks any git-tracked
          # argument as a source file rather than a patch; with no git directory
          # it reads them as patches. With no git history it can't look up the
          # ids in Fixes: tags either, so it would call each one unknown; those
          # are checked by hand (see "checkpatch" in that README).
          GIT_DIR=/nonexistent perl "$RUNNER_TEMP/cp/checkpatch.pl" --no-tree --strict --ignore MISSING_SIGN_OFF,UNKNOWN_COMMIT_ID \
            patches/kernel-7.3/*.patch patches/kernel-7.3/build/*.patch
