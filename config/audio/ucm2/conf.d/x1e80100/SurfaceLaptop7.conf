#
# Microsoft Surface Laptop 7 (X1E80100 "Romulus"): same audio layout as the
# ThinkPad T14s Gen 6 (2x WSA8845 speakers, WCD9385 headset codec, 2 mics).
# Based on alsa-ucm-conf's Qualcomm/x1e80100/LENOVO-T14s.conf; adds the
# Romulus-HiFi.conf verb and CLS_AB_LOHIFI at boot, and sets the WSA digital
# volumes itself (see the BootSequence below).
#
# UCM reads conf.d/<driver>/<card long name>.conf before its DMI tables, so
# install this file as
#   /usr/share/alsa/ucm2/conf.d/x1e80100/<card long name>.conf
# The long name is the line under "X1E80100-Romulus" in /proc/asound/cards. It
# starts with MicrosoftCorporation-MicrosoftSurfaceLaptop7thEdition- and ends
# in a configuration code that differs between models. See docs/audio.md.
#
# Needed only with alsa-ucm-conf older than 1.2.16. 1.2.15 maps this machine
# by DMI to the T14s profile; 1.2.16 adds the CLS_AB_LOHIFI headphone sequence.
Syntax 4

SectionUseCase."HiFi" {
	File "/Qualcomm/x1e80100/Romulus-HiFi.conf"
	Comment "HiFi quality Music."
}

# The X1E80100 device tree prefixes the WSA macro's controls with "WSA ", so
# codecs/qcom-lpass/wsa-macro/init.conf ('WSA_RX0 Digital Volume') fails on
# this card, and alsa-lib then skips the rest of the boot sequence. Set the
# prefixed controls here instead of including that file. 81 is -3 dB, the
# most the kernel's speaker cap allows (range 0-81); on a kernel without the
# cap it is 3 dB below the 0 dB default.
BootSequence [
	cset "name='HPHL Volume' 20"
	cset "name='HPHR Volume' 20"
	cset "name='ADC2 Volume' 10"
	cset "name='RX HPH Mode' CLS_AB_LOHIFI"
	cset "name='WSA WSA_RX0 Digital Volume' 81"
	cset "name='WSA WSA_RX1 Digital Volume' 81"
]

Include.card-init.File "/lib/card-init.conf"
Include.ctl-remap.File "/lib/ctl-remap.conf"
Include.wcd-init.File "/codecs/wcd938x/init.conf"
Include.wsa-init.File "/codecs/wsa884x/two-speakers/init.conf"
Include.rxm-init.File "/codecs/qcom-lpass/rx-macro/init.conf"
