#
# Surface Laptop 7: load the Qualcomm crypto engine driver (qcrypto) on 7.3, skip it
# on the older 7.0.0-rc4+ kernel. Install as /etc/modprobe.d/sl7-deep-sleep.conf.
#
# 7.0.0-rc4+ (the ELLX-based kernel this machine ran before 7.3): qcrypto holds a
# constant 393600 kB/s ALWAYS-tagged interconnect vote, which keeps DDR out of
# self-refresh and CX from collapsing in suspend. Nothing uses the engine; the CPU's
# ARMv8 crypto extensions are faster.
#
# 7.3.0-sl7: the driver has to bind. With ItsLucas kit patches 0026/0027 it registers
# no algorithms (unless qcrypto.do_register_algos=1) and drops its vote in runtime PM,
# and its probe is what lets both qnoc-x1e80100 interconnect providers reach
# sync_state(). Blacklisting it there keeps every interconnect vote at its maximum.
#
# If you only run 7.3 or later, you do not need this file. If your older kernel has a
# different release string, put that (uname -r) in place of 7.0.0-rc4+.
install qcrypto [ "$(uname -r)" = 7.0.0-rc4+ ] || /sbin/modprobe --ignore-install qcrypto $CMDLINE_OPTS
