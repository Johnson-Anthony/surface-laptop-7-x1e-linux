#
# Copy of alsa-ucm-conf 1.2.16's codecs/qcom-lpass/rx-macro/HeadphoneEnableSeq.conf
# under a new name, so it does not overwrite the distribution's older file.
# Unlike 1.2.14's version it sets no 'RX HPH Mode' (that would undo the
# wcd938x CLS_AB_LOHIFI setting) and leaves the RX compander off
# (upstream commits c887eeb and 8e6acab).
EnableSequence [
	cset "name='RX_HPH PWR Mode' LOHIFI"
	cset "name='RX_MACRO RX0 MUX' AIF1_PB"
	cset "name='RX_MACRO RX1 MUX' AIF1_PB"
	cset "name='RX INT0_1 MIX1 INP0' RX0"
	cset "name='RX INT1_1 MIX1 INP0' RX1"
	cset "name='RX INT0 DEM MUX' CLSH_DSM_OUT"
	cset "name='RX INT1 DEM MUX' CLSH_DSM_OUT"
]
