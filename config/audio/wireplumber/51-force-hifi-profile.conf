#
# Pin the Surface Laptop 7's built-in sound card to the UCM "HiFi" profile
# (WirePlumber 0.5 or later).
#
# The "pro-audio" profile bypasses UCM, so the WCD9385 codec never gets its
# enable sequence and the headphones play loud noise. WirePlumber had saved
# pro-audio from a boot before the UCM files were installed and restored it
# on every login.
#
# Install: ~/.config/wireplumber/wireplumber.conf.d/51-force-hifi-profile.conf
# (or /etc/wireplumber/wireplumber.conf.d/), then
#   systemctl --user restart wireplumber
monitor.alsa.rules = [
  {
    matches = [ { device.name = "alsa_card.platform-sound" } ]
    actions = { update-props = { device.profile = "HiFi", api.acp.auto-profile = false } }
  }
]
